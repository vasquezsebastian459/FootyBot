<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driblab Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        .chatbot-container {
            width: 1000px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }
        .chat-window {
            height: 600px;
            border: 1px solid #ccc;
            overflow-y: scroll;
            padding: 10px;
            margin-bottom: 10px;
        }
        .input-container {
            display: flex;
        }
        .input-container input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px 0 0 5px;
        }
        .input-container button {
            padding: 10px;
            border: none;
            background-color: #0044cc;
            color: #fff;
            border-radius: 0 5px 5px 0;
            cursor: pointer;
        }
        .input-container button:hover {
            background-color: #003399;
        }
        .chat-message {
            background-color: #e6f2ff;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
        }
        .chat-message.user {
            color: #0044cc;
            font-weight: bold;
        }
        .chat-message.assistant {
            color: #0066ff;
        }
    </style>
</head>
<body>
    <div class="chatbot-container">
        <h2>Driblab Chatbot</h2>
        <p>I am a football Chatbot. Please only ask football related questions! 
            I am still in development so try asking me specific questions. I will try my best to answer them.
        </p>
        <div class="chat-window" id="chat-window">
            <!-- Chat messages will appear here -->
        </div>
        <div class="input-container">
            <input type="text" id="user-input" placeholder="Type your message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
    <script>
        let messages = [{ role: "assistant", content: "How may I help you?" }];
        let context = "";

        function displayMessages() {
            const chatWindow = document.getElementById('chat-window');
            chatWindow.innerHTML = '';
            messages.forEach(message => {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'chat-message ' + message.role;
                messageDiv.textContent = message.role.charAt(0).toUpperCase() + message.role.slice(1) + ': ' + message.content;
                chatWindow.appendChild(messageDiv);
            });
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('user-input');
            const userMessage = input.value;
            if (userMessage.trim()) {
                messages.push({ role: "user", content: userMessage });
                displayMessages();
                input.value = '';

                console.log('Sending message:', userMessage);
                console.log('Current context:', context);

                // Send user message to the backend to get a response
                fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: userMessage, context: context })
                })
                .then(response => {
                    console.log('Server response:', response);
                    return response.json();
                })
                .then(data => {
                    console.log('Received data:', data);
                    messages.push({ role: "assistant", content: data.response });
                    context += ` ${data.keyinfo_context} Generated Explanation: ${data.response}`;
                    displayMessages();
                })
                .catch(error => {
                    console.error('Error:', error);
                });
            }
        }

        // Add event listener for "Enter" key on the input field
    document.getElementById('user-input').addEventListener('keypress', function(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    });

        // Initialize chat with the first message
        displayMessages();
    </script>
</body>
</html>
